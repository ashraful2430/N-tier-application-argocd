services:
  launchboard-db:
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "1.0", memory: 1G}, reservations: {memory: 512M}}}
  launchboard-backend:
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "1.0", memory: 512M}, reservations: {memory: 256M}}}
  launchboard-frontend:
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 128M}, reservations: {memory: 64M}}}
