# Secret uses stringData for labs; encrypt with Sealed Secrets in shared clusters.
apiVersion: v1
kind: Secret
metadata: {name: launchboard-secret, namespace: devops-launchboard}
type: Opaque
stringData: {POSTGRES_PASSWORD: "[DB_PASSWORD]", DATABASE_URL: "postgresql+asyncpg://launchboard:[DB_PASSWORD]@launchboard-db:5432/launchboard"}
