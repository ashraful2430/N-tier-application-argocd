# Services expose backend API and PostgreSQL internally.
apiVersion: v1
kind: Service
metadata: {name: launchboard-backend, namespace: devops-launchboard}
spec: {selector: {app: launchboard-backend}, ports: [{name: http, port: 8000, targetPort: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: launchboard-db, namespace: devops-launchboard}
spec: {selector: {app: launchboard-db}, ports: [{name: postgres, port: 5432, targetPort: 5432}]}
