services:
  launchboard-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launchboard
      POSTGRES_USER: launchboard_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - launchboard-postgres-data:/var/lib/postgresql/data
    networks:
      - launchboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchboard_user -d launchboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  launchboard-migrate:
    image: launchboard-backend:phase-5
    environment:
      APP_NAME: DevOps LaunchBoard API
      APP_ENV: production
      POSTGRES_HOST: launchboard-db
      POSTGRES_DB: launchboard
      POSTGRES_USER: launchboard_user
      CORS_ORIGINS: http://YOUR_EC2_PUBLIC_IP
      SEED_DEMO_DATA: "false"
    secrets:
      - db_password
    networks:
      - launchboard
    command:
      - /bin/sh
      - -c
      - |
        until python -c "import socket; s=socket.create_connection(('launchboard-db', 5432), timeout=3); s.close()"; do
          echo "waiting for postgres"
          sleep 2
        done
        export DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$$(cat /run/secrets/db_password)@$${POSTGRES_HOST}:5432/$${POSTGRES_DB}"
        alembic upgrade head
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: none

  launchboard-backend:
    image: launchboard-backend:phase-5
    environment:
      APP_NAME: DevOps LaunchBoard API
      APP_ENV: production
      POSTGRES_HOST: launchboard-db
      POSTGRES_DB: launchboard
      POSTGRES_USER: launchboard_user
      CORS_ORIGINS: http://YOUR_EC2_PUBLIC_IP
      SEED_DEMO_DATA: "true"
    secrets:
      - db_password
    networks:
      - launchboard
    command:
      - /bin/sh
      - -c
      - |
        until python -c "import socket; s=socket.create_connection(('launchboard-db', 5432), timeout=3); s.close()"; do
          echo "waiting for postgres"
          sleep 2
        done
        export DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$$(cat /run/secrets/db_password)@$${POSTGRES_HOST}:5432/$${POSTGRES_DB}"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  launchboard-frontend:
    image: launchboard-frontend:phase-5
    ports:
      - target: 8080
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - launchboard
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  launchboard:
    driver: overlay
    attachable: true

volumes:
  launchboard-postgres-data:

secrets:
  db_password:
    external: true
