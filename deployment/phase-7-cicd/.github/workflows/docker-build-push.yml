name: phase-7-docker-build-scan-push

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to GitHub Container Registry
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-launchboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-launchboard-frontend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  docker:
    name: Build, scan, and optionally push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.push_images == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f deployment/phase-7-cicd/Dockerfile.backend \
            -t launchboard-backend:phase-7 \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f deployment/phase-7-cicd/Dockerfile.frontend \
            --build-arg VITE_API_URL= \
            -t launchboard-frontend:phase-7 \
            -t "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            .

      - name: Scan backend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            launchboard-backend:phase-7

      - name: Scan frontend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            launchboard-frontend:phase-7

      - name: Push backend image
        if: ${{ github.event_name == 'push' || inputs.push_images == 'true' }}
        run: docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

      - name: Push frontend image
        if: ${{ github.event_name == 'push' || inputs.push_images == 'true' }}
        run: docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
