apiVersion: batch/v1
kind: CronJob
metadata:
  name: launchboard-postgres-dump
  namespace: devops-launchboard
spec:
  schedule: "30 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: launchboard-secret
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  mkdir -p /backups
                  pg_dump -h launchboard-db -U launchboard_user -d launchboard > /backups/launchboard-$(date +%Y%m%d%H%M%S).sql
                  find /backups -type f -name "launchboard-*.sql" -mtime +7 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: launchboard-postgres-backups
