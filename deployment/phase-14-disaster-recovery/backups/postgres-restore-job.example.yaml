apiVersion: batch/v1
kind: Job
metadata:
  name: launchboard-postgres-restore
  namespace: devops-launchboard
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pg-restore
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: launchboard-secret
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              psql -h launchboard-db -U launchboard_user -d launchboard < /backups/RESTORE_FILE.sql
          volumeMounts:
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: launchboard-postgres-backups
