server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; } location /api/ { proxy_pass http://launchboard-backend:8000/api/; } location /health { proxy_pass http://launchboard-backend:8000/health; } location /ready { proxy_pass http://launchboard-backend:8000/ready; } location / { try_files $uri $uri/ /index.html; } }
