server {
    listen 80;
    server_name [DOMAIN_NAME];
    root /var/www/devops-launchboard;
    index index.html;
    location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://127.0.0.1:8000/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://127.0.0.1:8000/health; }
    location /ready { proxy_pass http://127.0.0.1:8000/ready; }
    location / { try_files $uri $uri/ /index.html; }
}
