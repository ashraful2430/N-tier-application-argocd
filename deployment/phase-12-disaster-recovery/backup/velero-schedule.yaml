apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: launchboard-daily
  namespace: velero
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces:
      - devops-launchboard
    snapshotVolumes: true
    ttl: 168h0m0s
    storageLocation: default
    volumeSnapshotLocations:
      - default
